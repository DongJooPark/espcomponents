      return {{0x30, 0xbc, 0x00, 0x36, 0x03, 0x01, 0x00, 0x00, 0x11, 0x00, target, 0x00, 0x00, 0x00, 0x00, 0x00},{0x30, 0xdc, 0x00, 0x36, 0x03}};
    
    # [유지] 안방 보일러 주기적 상태 업데이트 패킷 정의
    command_update: 
      data: [0x30, 0xbc, 0x00, 0x36, 0x03, 0x01, 0x00, 0x3a, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      ack: [0x30, 0xdc, 0x00, 0x36, 0x03]
    update_interval: 2h





















    

  #Room4
  - platform: uartex
    name: "Livingroom 2 Heater"
    id: livingroom_2_heater
    visual:
      min_temperature: 5 °C
      max_temperature: 30 °C
      temperature_step: 1 °C
    state: 
      data: [0x30, 0xd0, 0x00, 0x36, 0x04]
      mask: [0xff, 0xf0, 0xff, 0xff, 0xff]

    
    state_temperature_current:
      offset: 12
      length: 1
      precision: 0
    state_temperature_target:
      offset: 10
      length: 1
      precision: 0

    # -------------------------------------------------------------
    # [최종 복구] 과거 파이썬 규칙(1101 = OFF)을 ESPHome 문법으로 완벽 복구
    # -------------------------------------------------------------
    state_off:
      offset: 8
      data: [0x11, 0x01] # 패킷 앞자리가 1101 이면 화면을 '꺼짐(OFF)'으로 표기!
      mask: [0xff, 0xff]

    # [최종 복구] 과거 파이썬 규칙(1101 이 아니면 = HEAT)에 맞게 난방 조건 설정
    state_heat:
      offset: 8
      data: [0x11, 0x00] # 패킷 앞자리가 1100 이면 화면을 '난방(HEAT)'으로 표기!
      mask: [0xff, 0xff]

    # 프리셋 충돌 방지를 위해 유령값 고정 유지
    state_preset_away:
      offset: 9
      data: [0x99]
    state_preset_none:
      offset: 9
      data: [0x99]



    # [최종 복구] 꺼짐을 누르면 월패드가 정확히 1101 신호를 반환하도록 쏘는 정석 명령입니다.
    command_off: !lambda |-
      return {{0x30, 0xbc, 0x00, 0x36, 0x04, 0x01, 0x00, 0x00, 0x11, 0x01, 0x12, 0x00, 0x00, 0x00, 0x00, 0x00},{0x30, 0xdc, 0x00, 0x36, 0x04}};

    
    # [유지] HEAT(난방) 명령 수신 시: 안방 월패드로 설정 온도가 포함된 '난방 일반 패킷'을 전송합니다.
    command_heat: !lambda |-
      uint8_t target = id(livingroom_2_heater).target_temperature;
      return {{0x30, 0xbc, 0x00, 0x36, 0x04, 0x01, 0x00, 0x00, 0x11, 0x00, target, 0x00, 0x00, 0x00, 0x00, 0x00},{0x30, 0xdc, 0x00, 0x36, 0x04}};
    
    # [수정] 프리셋 없음(None) 상태 진입 시: 불필요한 중복 신호 차단을 위해 빈 값을 리턴합니다.
    command_preset_none: !lambda |-
      return {};
      
    # [수정] 프리셋 외출(Away) 상태 진입 시: 화면 클릭 혼선 방지를 위해 신호 송신을 차단합니다.
    command_preset_away: !lambda |-
      return {};
      
    # [유지] 온도 조절 명령 수신 시: 안방이 난방 중일 때만 온도가 변하도록 패킷을 전송합니다.
    command_temperature: !lambda |-
      if (id(livingroom_2_heater).mode == climate::CLIMATE_MODE_OFF) return {};
      uint8_t target = x;
      return {{0x30, 0xbc, 0x00, 0x36, 0x04, 0x01, 0x00, 0x00, 0x11, 0x00, target, 0x00, 0x00, 0x00, 0x00, 0x00},{0x30, 0xdc, 0x00, 0x36, 0x04}};
    
    # [유지] 안방 보일러 주기적 상태 업데이트 패킷 정의
    command_update: 
      data: [0x30, 0xbc, 0x00, 0x36, 0x04, 0x01, 0x00, 0x3a, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      ack: [0x30, 0xdc, 0x00, 0x36, 0x04]
    update_interval: 2h











    

